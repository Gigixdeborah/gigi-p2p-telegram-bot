services:
  - type: web
    name: gigi-webhook
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gigi-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false

  - type: worker
    name: gigi-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gigi-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: WEBHOOK_BASE
        fromService:
          type: web
          name: gigi-webhook
          property: host
      - key: WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false

  - type: pserv
    name: gigi-postgres
    runtime: postgres
    plan: starter
    postgresMajorVersion: 16

