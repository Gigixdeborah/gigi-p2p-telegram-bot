<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="Gigi Wallet Signing" />
    <meta property="og:description" content="Secure EVM transaction signing" />
    <title>EVM Wallet Sign</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      body{font-family:sans-serif;padding:1rem;max-width:400px;margin:auto}
      @media(max-width:600px){h1{font-size:1.2rem}}
      #success{display:none;position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#e0ffe0;padding:1em;border-radius:8px}
    </style>
</head>
<body>
    <noscript>Please enable JavaScript to use this page.</noscript>
    <h1 id="title">Sign EVM Transaction</h1>
    <script src="config.js"></script>
    <select id="langSel">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
    </select>
    <form id="txForm">
        <input type="hidden" name="chain" value="evm">
        <label>To: <input type="text" name="to" required></label><br>
        <label>Amount: <input type="number" name="amount" step="0.0001" required></label><br>
        <button type="submit">Send</button>
    </form>
    <div id="success">✅ Success</div>
    <audio id="ding" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAgD4AAIA+AAABAAgAZGF0YYAAAAA=" preload="auto"></audio>
    <script>
    const msgs={
      en:{title:'Sign EVM Transaction',success:'Transaction sent!'},
      fr:{title:'Signer la transaction EVM',success:'Transaction envoyée!'},
      es:{title:'Firmar transacción EVM',success:'¡Transacción enviada!'},
      zh:{title:'签署EVM交易',success:'交易已发送'}
    };
    function setLang(l){const m=msgs[l]||msgs.en;document.getElementById('title').innerText=m.title;currentSuccess=m.success;}
    let currentSuccess=msgs.en.success;setLang((navigator.language||'en').slice(0,2));
    document.getElementById('langSel').value=(navigator.language||'en').slice(0,2);
    document.getElementById('langSel').onchange=e=>setLang(e.target.value);
    document.getElementById('txForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target).entries());
        const res = await fetch(window.GIGI_CONFIG.webhookUrl.replace('ton', 'evm'), {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(data)
        });
        if(res.ok){
          document.getElementById('success').style.display='block';
          document.getElementById('ding').play();
        }
    }
    </script>
</body>
</html>
