<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Wallet Sign</title>
</head>
<body>
    <h1>Sign TON Transaction</h1>
    <form id="txForm">
        <input type="hidden" name="chain" value="ton">
        <label>To: <input type="text" name="to" required></label><br>
        <label>Amount: <input type="number" name="amount" step="0.0001" required></label><br>
        <button type="submit">Send</button>
    </form>
    <script>
    document.getElementById('txForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target).entries());
        const res = await fetch('/ton-webhook', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(data)
        });
        alert(await res.text());
    }
    </script>
</body>
</html>
